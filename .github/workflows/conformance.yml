# Family Archive plugin conformance gate.
# Runs sdktest golden vectors against the SDK contract on every push and tagged
# release. The SDK resolves from the tagged go.mod requirement.
#
# The semver-pin step enforces the SDK versioning policy end-to-end: the
# plugin-sdk `require` in go.mod must be a tagged semver release (vX.Y.Z), and
# the module must resolve from that tag, not a local replace or floating ref.
name: conformance

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '27 8 * * *'
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: 'plugin-sdk ref to test against'
        required: false
        type: string

jobs:
  fast-conformance:
    name: fast conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: beamfall-plugin-familyarchive
      - name: Checkout SDK override
        if: ${{ inputs.sdk_ref != '' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: beamfall/plugin-sdk
          ref: ${{ inputs.sdk_ref }}
          path: beamfall-plugin-sdk
      - name: Read plugin-sdk semver pin from go.mod
        id: sdk-pin
        working-directory: beamfall-plugin-familyarchive
        run: |
          pin=$(go mod edit -json | \
            python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["Require"] if x["Path"]=="github.com/beamfall/plugin-sdk"]; print(r[0]["Version"] if r else "")')
          echo "plugin-sdk require = ${pin:-<none>}"
          if [ -z "$pin" ]; then
            echo "::error::plugin-sdk require missing from go.mod"; exit 1
          fi
          if ! printf '%s' "$pin" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::plugin-sdk must be pinned to a tagged semver release (vX.Y.Z), not a floating ref/pseudo-version — got '$pin'"
            exit 1
          fi
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: beamfall-plugin-familyarchive/go.mod
      - name: Use SDK override
        if: ${{ inputs.sdk_ref != '' }}
        working-directory: beamfall-plugin-familyarchive
        run: go mod edit -replace github.com/beamfall/plugin-sdk=../beamfall-plugin-sdk
      - name: gofmt
        working-directory: beamfall-plugin-familyarchive
        run: gofmt -l . | tee /dev/stderr | (! grep -q .)
      - name: vet
        working-directory: beamfall-plugin-familyarchive
        run: go vet ./...
      - name: build
        working-directory: beamfall-plugin-familyarchive
        run: go build ./...
      - name: conformance + per-package coverage + depth contract
        working-directory: beamfall-plugin-familyarchive
        run: python3 .github/workflows/test_depth_gate.py check
      - uses: golangci/golangci-lint-action@25e2cdc5eb1d7a04fdc45ff538f1a00e960ae128 # v8.0.0
        with:
          version: v2.15.0
          working-directory: beamfall-plugin-familyarchive

  # The required race job stays parallel to the fast conformance job so PR latency
  # grows only by the slower of the two, not their sum.
  race:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: beamfall-plugin-familyarchive
      - name: Checkout SDK override
        if: ${{ inputs.sdk_ref != '' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: beamfall/plugin-sdk
          ref: ${{ inputs.sdk_ref }}
          path: beamfall-plugin-sdk
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: beamfall-plugin-familyarchive/go.mod
      - name: Use SDK override
        if: ${{ inputs.sdk_ref != '' }}
        working-directory: beamfall-plugin-familyarchive
        run: go mod edit -replace github.com/beamfall/plugin-sdk=../beamfall-plugin-sdk
      - name: race
        working-directory: beamfall-plugin-familyarchive
        run: go test -race -count=1 ./...

  # Preserve the existing required-check name while making race mechanically
  # blocking. The two substantive jobs run in parallel; this aggregator is the
  # only serial tail and does no checkout/build work.
  conformance:
    name: conformance
    needs: [fast-conformance, race]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require fast and race jobs
        env:
          FAST_RESULT: ${{ needs.fast-conformance.result }}
          RACE_RESULT: ${{ needs.race.result }}
        run: |
          test "$FAST_RESULT" = success
          test "$RACE_RESULT" = success

  # Untrusted sidecar JSON and capture-date strings get bounded scheduled fuzz
  # time without adding provider/network work or emulator cost to the PR gate.
  fuzz:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - FuzzParseCaptureDate
          - FuzzReadSidecar
    steps:
      - name: Checkout plugin
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: beamfall-plugin-familyarchive
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: beamfall-plugin-familyarchive/go.mod
      - name: Bounded fuzz target
        working-directory: beamfall-plugin-familyarchive
        run: go test -run '^$' -fuzz "^${{ matrix.target }}$" -fuzztime=20s .
